name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Tests
        run: make test
      - name: Prose
        run: make prose
