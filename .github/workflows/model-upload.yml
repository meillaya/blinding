# InferenceOps — upload the trained model artifact to S3 on a model tag (todo 28).
#
# On a tag push matching `model-*`, scripts/upload_model.sh uploads the artifact
# through the storage abstraction (S3StorageBackend.put_artifact) and registers
# it with an s3:// artifact_uri (approved_for_prod=false; the eval gate flips
# approval, promote consumes it). The artifact (models/artifacts/**/*.pkl) is
# gitignored, so the job first trains it with `make train` (deterministic
# synthetic dataset — same provenance as the model-eval-gate workflow).
#
# Security:
#   - No inline secrets: AWS auth is OIDC (aws-actions/configure-aws-credentials
#     with role-to-assume, no static keys) enabled by id-token: write; the
#     bucket comes from ${{ secrets.MODEL_BUCKET }}.
#   - Validated with actionlint; the S3 upload step is NOT executed under act
#     (it needs real AWS credentials) — push a `model-*` tag to run it.
name: model-upload

on:
  push:
    tags: ["model-*"]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for AWS OIDC role assumption
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Train model artifact (gitignored; required for upload)
        run: make train
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload model artifact to S3 + register
        env:
          MODEL_BUCKET: ${{ secrets.MODEL_BUCKET }}
        run: scripts/upload_model.sh
