# InferenceOps local-dev stack (todo 12): model-server + gateway + prometheus +
# grafana, wired for the local observability story. Run rootless:
#
#   export DOCKER_HOST=unix:///run/user/1000/docker-me.sock
#   docker compose up -d --build
#
# The gateway (public, :8080) fronts the model-server (internal only) and is the
# sole authenticated edge; prometheus scrapes both services' /metrics and grafana
# is provisioned (datasource + dashboard provider) from observability/. The four
# Grafana dashboard JSONs land in observability/grafana/dashboards/ in todo 33 —
# the provider mounted here simply finds nothing until then (/api/search → []).

services:
  model-server:
    build:
      context: .
      dockerfile: apps/model-server/Dockerfile
    image: inferenceops/model-server:dev
    # Internal only: the gateway proxies to http://model-server:8080 over the
    # compose network; no host port is published.
    expose:
      - "8080"
    # Image-level HEALTHCHECK (/healthz) drives the healthy state the gateway's
    # depends_on waits on.

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    image: inferenceops/gateway:dev
    environment:
      MODEL_SERVER_URL: http://model-server:8080
      API_KEYS: test-key
      RATE_LIMIT_RPS: "100"
    ports:
      - "8080:8080"
    # Wait until the model server passes its healthcheck before starting, so the
    # first proxied /v1/predict does not race the upstream's model load.
    depends_on:
      model-server:
        condition: service_healthy
    # Image-level HEALTHCHECK (/healthz) drives the healthy state.

  prometheus:
    image: prom/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      # prom/prometheus is busybox-based (has wget); /-/healthy is unauthenticated.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # Datasource + dashboard-provider provisioning (this todo).
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON source for the file provider (populated in todo 33).
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      # grafana/grafana is alpine-based (has wget); /api/health is unauthenticated.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
