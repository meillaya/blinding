# kind cluster config for the InferenceOps local stack (todo 19).
#
# Applied by scripts/deploy_local.sh:
#
#     kind create cluster --name inferenceops --config infra/scripts/kind-config.yaml
#
# Single control-plane node. The nginx ingress controller (installed by
# scripts/deploy_local.sh from the kind provider manifest) is scheduled onto
# nodes labelled `ingress-ready=true`; the kubeadmConfigPatches below stamp that
# label onto the control-plane node, which is exactly what the kind ingress
# documentation relies on.
#
# --- Port mapping (rootless-docker friendly) -------------------------------
#   host 8080 -> container 80    (ingress HTTP)
#   host 8443 -> container 443   (ingress HTTPS)
#
# We publish HIGH host ports (8080/8443) on purpose. Docker here runs ROOTLESS,
# and a rootless daemon cannot bind privileged host ports (< 1024) unless the
# kernel permits it via:
#
#     sysctl net.ipv4.ip_unprivileged_port_start=0
#
# On this host that sysctl is the default (1024), so mapping host 80/443 would
# fail with EACCES at `kind create cluster`. Using 8080/8443 sidesteps that
# dependency entirely; the stack is then reached at http://localhost:8080 and
# https://localhost:8443.
#
# If you DO set `net.ipv4.ip_unprivileged_port_start=0` (e.g.
# `sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0`), you may map the
# standard ports directly instead:
#
#     extraPortMappings:
#       - containerPort: 80
#         hostPort: 80
#         protocol: TCP
#       - containerPort: 443
#         hostPort: 443
#         protocol: TCP
#
# and reach the stack at http://localhost / https://localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
