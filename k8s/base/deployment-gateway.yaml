# gateway Deployment (todo 16). Auth + rate-limit edge that proxies to the
# in-cluster model-server (http://service-model-server:8080). Serves /healthz
# on port 8080 (exempt from auth so probes need no credentials). Lighter
# resources than the model-server. The public ingress (todo 17) fronts
# service-gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: inferenceops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: inferenceops
    spec:
      serviceAccountName: gateway
      # Graceful drain on shutdown (lighter than the model-server).
      terminationGracePeriodSeconds: 15
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway
      containers:
        - name: gateway
          image: inferenceops/gateway:dev
          # Images are `kind load`'d (todo 19); there is no registry to pull from.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # In-cluster model-server Service the gateway proxies to.
            - name: MODEL_SERVER_URL
              value: "http://service-model-server:8080"
            # API keys come from the Secret (never the ConfigMap).
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: gateway-api-keys
                  key: API_KEYS
            - name: RATE_LIMIT_RPS
              valueFrom:
                configMapKeyRef:
                  name: inferenceops-config
                  key: RATE_LIMIT_RPS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: inferenceops-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          # /healthz is the only health endpoint the gateway exposes; it is
          # exempt from auth and rate-limiting so probes always succeed.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
