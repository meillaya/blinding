# HorizontalPodAutoscaler (todo 17). Scales the model-server Deployment (the
# serving workload) on cpu (70%) + memory (80%) utilization, 2..10 replicas.
# The custom RPS-per-replica metric (prometheus-adapter) is added in todo 20;
# base stays cpu+memory only. minReplicas matches the Deployment's replicas (2)
# and the podAntiAffinity spread so we never scale below the HA floor.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-server
  labels:
    app.kubernetes.io/name: model-server
    app.kubernetes.io/component: serving
    app.kubernetes.io/part-of: inferenceops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
