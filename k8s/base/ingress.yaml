# Ingress (todo 17). Public edge: the nginx ingress fronts the GATEWAY
# (service-gateway:8080), which is the single entrypoint that authenticates,
# rate-limits, and proxies to the model-server. It does NOT route directly to
# service-model-server. Host inferenceops.local (mapped via /etc/hosts or the
# ingress controller's external IP in the local kind cluster, todo 19).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inferenceops
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: inferenceops
spec:
  ingressClassName: nginx
  rules:
    - host: inferenceops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-gateway
                port:
                  number: 8080
