# OpenTelemetry Collector (todo 34): Deployment + Service + config ConfigMap.
# The gateway + model-server export OTLP/HTTP to http://otel-collector:4318
# (OTEL_ENDPOINT, wired via the inferenceops-config ConfigMap). The config is a
# verbatim copy of observability/opentelemetry/collector.yaml (the docker-compose
# service mounts that file) — keep the two in sync. Single replica, bounded
# resources: the collector is a dev-scaffold pipeline head, not a HA gateway.
# The image is public (Docker Hub) and pulled by the node, so IfNotPresent —
# unlike the apps, it is NOT `kind load`'d.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: inferenceops
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
    exporters:
      # Trace backend (Tempo/Jaeger). Point this at a real backend when one is
      # deployed; until then DNS fails fast and batches drop after bounded retry.
      otlp:
        endpoint: "tempo:4317"
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 256
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 60s
      logging:
        verbosity: basic
      prometheus:
        endpoint: 0.0.0.0:8889
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp, logging]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: inferenceops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: inferenceops
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.102.1
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: self-metrics
              containerPort: 8888
              protocol: TCP
            - name: prom-exporter
              containerPort: 8889
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: inferenceops
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: self-metrics
      port: 8888
      targetPort: self-metrics
      protocol: TCP
    - name: prom-exporter
      port: 8889
      targetPort: prom-exporter
      protocol: TCP
