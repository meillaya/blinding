# PodDisruptionBudget (todo 17). Guarantees at least one model-server pod stays
# available during voluntary disruptions (node drain, rolling upgrades), pairing
# with the Deployment's maxUnavailable:0 rollout strategy. Selector matches the
# model-server pod-template labels (app.kubernetes.io/name: model-server).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-server
  labels:
    app.kubernetes.io/name: model-server
    app.kubernetes.io/component: serving
    app.kubernetes.io/part-of: inferenceops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-server
