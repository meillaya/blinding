# ============================================================================
# EXAMPLE ONLY — NOT A REAL SECRET. Safe to commit.
#
# Copy this file to `secret.yaml` (git-ignored) and replace the placeholder
# value(s) with real credentials before deploying anywhere that matters:
#
#     cp k8s/base/secret.example.yaml k8s/base/secret.yaml   # then edit
#
# For local kind dev (todo 19) the placeholder is sufficient: the gateway
# accepts these dev keys so the stack is deployable out-of-the-box. The
# gateway reads API_KEYS as a comma-separated list (or JSON array) — see
# inferenceops_gateway.config._parse_api_keys_env.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: gateway-api-keys
  labels:
    app.kubernetes.io/name: gateway-api-keys
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: inferenceops
type: Opaque
# stringData (plaintext) is used deliberately so the value is obviously a
# placeholder; k8s base64-encodes it on apply.
stringData:
  # REPLACE ME. Comma-separated API keys the gateway accepts. These are
  # fake dev placeholders — do NOT treat them as credentials.
  API_KEYS: "dev-key-REPLACE-ME-0000000000000000,dev-key-REPLACE-ME-1111111111111111"
