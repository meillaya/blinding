# ServiceAccounts for the two apps (todo 16). Each Deployment runs under its
# own SA so RBAC can be scoped per-app later (the canary, todo 29, reuses the
# model-server SA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server
  labels:
    app.kubernetes.io/name: model-server
    app.kubernetes.io/component: serving
    app.kubernetes.io/part-of: inferenceops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: inferenceops
