# local model-server: never pull (images are `kind load`'d, no registry) and
# keep 2 replicas. Strategic-merge patch: containers merge by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: model-server
          imagePullPolicy: Never
