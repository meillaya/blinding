# KEDA ScaledObject — DOCUMENTED ALTERNATIVE scaler for model-server (todo 20).
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#  ONLY ONE SCALER PER DEPLOYMENT. This ScaledObject and the cpu/memory/RPS HPA
#  (k8s/base/hpa.yaml + patch-hpa-custom-rps.yaml) BOTH drive model-server's
#  replica count. If both are active they FIGHT (each writes the scale
#  subresource). Apply this INSTEAD OF the HPA, never alongside it.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
# This file is deliberately NOT listed in kustomization.yaml `resources`, so a
# normal `kubectl apply -k k8s/overlays/local` does NOT create it (that would
# leave two scalers fighting). It is an opt-in alternative you apply by hand.
#
# SWITCH HPA -> KEDA:
#   kubectl --context kind-inferenceops -n inferenceops delete hpa model-server
#   kubectl --context kind-inferenceops apply -f k8s/overlays/local/scaledobject-model-server.yaml
#
# SWITCH KEDA -> HPA (restore the platform default):
#   kubectl --context kind-inferenceops delete -f k8s/overlays/local/scaledobject-model-server.yaml
#   kubectl --context kind-inferenceops apply -k k8s/overlays/local   # recreates the HPA
#
# KEDA install (one-time): see docs/autoscaling-strategy.md
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm install keda kedacore/keda --version 2.20.1 -n keda --create-namespace
#
# Trigger: the prometheus scaler queries the SAME total-RPS signal the HPA uses.
# With the default metricType=AverageValue, KEDA computes
#   desiredReplicas = ceil( queryValue / threshold ) = ceil( totalRPS / 30 ),
# i.e. ~30 RPS per replica — identical semantics to the HPA's external metric.
# The `model_version` label is left in the series so the canary discriminator
# (todo 30) can later split stable vs canary RPS here.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: model-server-rps
  namespace: inferenceops
  labels:
    app.kubernetes.io/name: model-server
    app.kubernetes.io/component: serving
    app.kubernetes.io/part-of: inferenceops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-server
  minReplicaCount: 2
  maxReplicaCount: 10
  # (pollingInterval/cooldownPeriod only apply when minReplicaCount=0; with a
  #  HA floor of 2 they are irrelevant, so they are omitted to avoid KEDA warnings.)
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://kube-prometheus-kube-prome-prometheus.monitoring.svc:9090
        query: sum(rate(inferenceops_request_count_total{namespace="inferenceops"}[1m]))
        # ~30 RPS per replica (totalRPS / 30 = desired replicas).
        threshold: "30"
        # Any real traffic lifts the scaler off idle; avoids flapping on noise.
        activationThreshold: "1"
