# Prod overlay (todo 18).
#   - replicas: 3 for model-server (above the base HA floor of 2).
#   - bumped CPU/memory for the serving workload.
#   - REQUIRED pod anti-affinity (hard hostname spread) — replaces the base's
#     soft preference via patch-model-server-antiaffinity.yaml (JSON6902).
#   - GPU scheduling for model-server: nodeSelector nvidia.com/gpu.present=true
#     + toleration for the nvidia.com/gpu=present:NoSchedule taint (matches the
#     EKS GPU node-group taint, todo 23). The nvidia.com/gpu resource REQUEST is
#     a COMMENTED option in patch-model-server.yaml — the default fraud model is
#     CPU-only; uncomment it for GPU workloads (e.g. vLLM).
#   - image tag `:prod`, imagePullPolicy: IfNotPresent.
#
# OPERATIONAL NOTE: the GPU nodeSelector pins model-server to GPU nodes, so this
# overlay assumes the (optional, default-off) EKS GPU node group (todo 23) is
# enabled. For a CPU-only deployment, drop the nodeSelector/toleration from
# patch-model-server.yaml or use the staging overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inferenceops

resources:
  - ../../base

images:
  - name: inferenceops/model-server
    newTag: prod
  - name: inferenceops/gateway
    newTag: prod

patches:
  - path: patch-model-server.yaml
  - path: patch-gateway.yaml
  # JSON6902 (list-of-ops file) targeting the model-server Deployment: swap the
  # soft anti-affinity for a hard (required) rule.
  - path: patch-model-server-antiaffinity.yaml
    target:
      kind: Deployment
      name: model-server
