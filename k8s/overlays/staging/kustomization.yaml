# Staging overlay (todo 18). Pre-prod environment fed by CI.
#   - image tag `:staging` (CI pushes inferenceops/{model-server,gateway}:staging).
#   - imagePullPolicy: IfNotPresent (staging has a real registry; pull only if
#     the node lacks the tag, reuse otherwise).
#   - replicas: 2 for model-server (HA floor; the base HPA scales it 2..10).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inferenceops

resources:
  - ../../base

images:
  - name: inferenceops/model-server
    newTag: staging
  - name: inferenceops/gateway
    newTag: staging

patches:
  - path: patch-model-server.yaml
  - path: patch-gateway.yaml
