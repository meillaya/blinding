# Fraud-detection training configuration (todo 6).
# Fully deterministic: the same seed reproduces the dataset, the fitted model,
# and every metric byte-for-byte.
model_id: fraud-detector
seed: 42

dataset:
  n_samples: 8000
  n_features: 20
  n_informative: 10
  n_redundant: 5
  class_sep: 1.2
  flip_y: 0.01
  fraud_ratio: 0.05 # fraud is rare: ~5% positive class
  val_fraction: 0.25

hyperparameters:
  n_estimators: 120
  max_depth: 3
  learning_rate: 0.1

artifact_dir: models/artifacts/fraud_detector
