# Helm/kind provisioning wrapper for the InferenceOps Grafana dashboards
# (todo 33) — the SIDECAR path.
#
# The kube-prometheus-stack Grafana subchart runs the dashboard sidecar
# (grafana-sc-dashboard), which watches EVERY namespace (NAMESPACE=ALL) for
# ConfigMaps labeled `grafana_dashboard: "1"` and hot-loads each `*.json` key
# into /tmp/dashboards. This kustomization wraps the SAME four dashboard JSONs
# the docker-compose file provider mounts (single source — no drift between the
# compose and kind paths) into one labeled ConfigMap.
#
# It lives beside the JSONs on purpose: kustomize's default load restrictor
# only allows configMapGenerator files at or below the kustomization root, and
# the Grafana file provider ignores non-JSON entries, so the compose mount is
# unaffected.
#
# Apply (NOT via `helm upgrade kube-prometheus` — todo 32 owns that release):
#
#   kubectl --context kind-inferenceops apply -k observability/grafana/dashboards
#
# Verify: kubectl -n monitoring port-forward svc/kube-prometheus-grafana 3000:80
#         curl -u admin:<grafana admin pw> localhost:3000/api/search
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# The sidecar's discovery label (LABEL=grafana_dashboard, LABEL_VALUE=1 on the
# grafana-sc-dashboard container). includeSelectors: false — a ConfigMap has no
# selector, and this keeps the label off any future generated selector fields.
labels:
  - pairs:
      grafana_dashboard: "1"
    includeSelectors: false

configMapGenerator:
  - name: inferenceops-grafana-dashboards
    files:
      - inference-overview.json
      - gpu-utilization.json
      - latency-breakdown.json
      - model-quality.json

generatorOptions:
  # Stable name so `apply`/`delete` are idempotent and the sidecar sees an
  # update, not a delete+recreate, on every change.
  disableNameSuffixHash: true
