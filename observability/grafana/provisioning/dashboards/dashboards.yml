# Grafana dashboard-provider provisioning for the InferenceOps local-dev stack
# (todo 12).
#
# A single file provider that loads any dashboard JSON dropped into
# /var/lib/grafana/dashboards — the compose stack bind-mounts
# observability/grafana/dashboards/ there. The four real dashboards are written in
# todo 33 (one JSON source reused by the Helm path); until then the directory is
# empty and /api/search returns [] (asserted empty here, populated in todo 33).

apiVersion: 1

providers:
  - name: InferenceOps
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
