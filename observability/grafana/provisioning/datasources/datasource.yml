# Grafana datasource provisioning for the InferenceOps local-dev stack (todo 12).
#
# A single Prometheus datasource pointing at the compose prometheus service. The
# fixed uid `prometheus` is what the dashboard JSONs (todo 33) reference as their
# datasource, so the same dashboards work here and on the Helm/k8s path (W4).

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true
