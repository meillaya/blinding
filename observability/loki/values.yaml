# loki-stack values (todo 34): single-binary Loki + promtail DaemonSet, the log
# aggregation half of the observability story (traces/metrics: todo 32/34 OTel).
#
#   helm upgrade --install loki grafana/loki-stack --version 2.10.3 \
#     -n monitoring -f observability/loki/values.yaml
#
# The chart's default promtail scrapeConfig tails every pod's container logs
# (/var/log/containers/*.log) with kubernetes_sd relabeling, so the gateway +
# model-server uvicorn logs in ns inferenceops are queryable by
# {namespace="inferenceops", pod=~"gateway-.*"} etc. — no custom scrape config
# needed. Deliberately lightweight (single replica, bounded resources, no
# persistence): a dev-scaffold log store, not a production Loki.
loki:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: false

promtail:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
