# OpenTelemetry Collector (todo 34): the trace/metric pipeline head for both
# apps. The gateway + model-server export OTLP/HTTP here (OTEL_ENDPOINT →
# http://otel-collector:4318); the collector batches, logs span batches to its
# own stdout (the logging exporter — proof spans arrived), re-exposes OTLP
# metrics for Prometheus scraping (the prometheus exporter on :8889), and
# forwards traces to a trace backend via the otlp exporter. No Tempo/Jaeger is
# deployed in this scaffold, so that endpoint is env-overridable and its export
# failures are async (queue + bounded retry): they log and drop, and never
# block span RECEPTION — the receiver's accepted-span count (internal metrics
# on :8888, otelcol_receiver_accepted_spans) climbs regardless.
#
# Shared verbatim by the docker-compose service and the k8s ConfigMap
# (k8s/base/otel-collector.yaml); image otel/opentelemetry-collector:0.102.1.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Trace backend (Tempo/Jaeger). Point this at a real backend when one is
  # deployed; until then DNS fails fast and batches drop after bounded retry.
  otlp:
    endpoint: "tempo:4317"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 256
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
  logging:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      # Internal self-metrics (otelcol_receiver_accepted_spans etc.), bound on
      # all interfaces so port-forward/compose mapping can reach them.
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, logging]
