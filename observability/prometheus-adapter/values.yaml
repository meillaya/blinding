# prometheus-adapter values (todo 20) — serves the custom-RPS EXTERNAL metric
# `inferenceops_rps` to the Kubernetes custom/external metrics APIs so the
# model-server HPA can scale on request rate (not just cpu/memory).
#
# Install (idempotent):
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus-adapter prometheus-community/prometheus-adapter \
#     --version 5.3.0 -n monitoring --create-namespace \
#     -f observability/prometheus-adapter/values.yaml
#
# Verify:
#   kubectl get --raw "/apis/external.metrics.k8s.io/v1beta1" | jq '.resources[].name'
#   # -> "inferenceops_rps.inferenceops"  (once Prometheus has scraped traffic)
#
# The rule maps the per-pod request rate to an external metric. The HPA sums
# the per-pod series (one per pod via `by (namespace, pod)`) to get the total
# deployment RPS and targets an AverageValue per replica (see
# k8s/overlays/local/patch-hpa-custom-rps.yaml).
#
# NOTE: prometheus_client exposes the Counter as `inferenceops_request_count_total`
# (OpenMetrics `_total` suffix), so the seriesQuery uses the real name.
prometheus:
  # In-cluster kube-prometheus-stack Prometheus (todo 19).
  url: http://kube-prometheus-kube-prome-prometheus.monitoring.svc
  port: 9090

rules:
  external:
    - seriesQuery: 'inferenceops_request_count_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
      name:
        matches: "^(.*)$"
        as: "inferenceops_rps"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'

# The adapter re-lists Prometheus series periodically; 30s keeps the external
# metric discovery fresh without hammering Prometheus.
extraArguments:
  - --metrics-relist-interval=30s
