# Prometheus config for the InferenceOps local-dev stack (todo 12).
#
# Scrapes the model server and the gateway on their /metrics endpoints. The model
# server exposes a Prometheus text exposition (todo 8/9); the gateway's own
# /metrics arrives in todo 33, so until then its scrape target reports DOWN (401:
# /metrics is behind API-key auth) — expected, and asserted only for model-server.
#
# A short scrape interval keeps the local QA loop snappy (targets flip UP within a
# few seconds of the services coming up).

global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: model-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - model-server:8080

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
