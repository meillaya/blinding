# PrometheusRule: DCGM GPU alerts (todo 32).
#
# Informational alerts for NVIDIA GPU utilisation and framebuffer memory,
# sourced from the DCGM exporter (DCGM_FI_DEV_* series). On a CPU-only node
# (this kind cluster) the DCGM series are ABSENT, so these expressions evaluate
# to no result and the alerts never fire — the PromQL is still syntactically
# valid and loads cleanly into Prometheus with zero GPU present.
#
# Applied via additionalPrometheusRulesMap in observability/prometheus/values.yaml.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inferenceops-gpu-alerts
  labels:
    app.kubernetes.io/part-of: inferenceops
    app.kubernetes.io/component: observability
spec:
  groups:
    - name: inferenceops.gpu
      rules:
        - alert: HighGpuUtilization
          expr: DCGM_FI_DEV_GPU_UTIL > 90
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "GPU utilisation above 90 %"
            description: "GPU {{ $labels.gpu }} utilisation is {{ $value }} % for the last 5 minutes."
        - alert: HighGpuMemoryUsage
          expr: |
            (
              DCGM_FI_DEV_FB_USED
              /
              (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)
            ) > 0.9
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "GPU framebuffer memory usage above 90 %"
            description: "GPU {{ $labels.gpu }} memory usage is {{ $value | humanizePercentage }} for the last 5 minutes."
