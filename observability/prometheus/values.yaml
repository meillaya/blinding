# kube-prometheus-stack values for InferenceOps (todo 19 bootstrap, extended todo 32).
#
# todo 19 installed the chart with DEFAULT values (no values file existed).
# This file makes the implicit defaults EXPLICIT and adds the alert rules:
#
#   1. grafana.sidecar.dashboards  — ConfigMap label `grafana_dashboard: "1"`,
#      searchNamespace ALL (todo 33 drops dashboard ConfigMaps with that label).
#   2. grafana.sidecar.datasources — default Prometheus datasource, uid `prometheus`
#      (the uid the dashboard JSONs reference; same uid as the compose stack).
#   3. prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues: true
#      — the Prometheus CR selects ServiceMonitors carrying the Helm release label
#      (`release: kube-prometheus`); the model-server ServiceMonitors (todo 19/30)
#      already carry it.
#   4. additionalPrometheusRulesMap — the three InferenceOps alert rule groups
#      (latency / error-rate / GPU); the chart renders each key as a PrometheusRule
#      CR named `<fullname>-<key>`.
#
# The standalone PrometheusRule YAMLs in rules/ are the authoritative reference
# (same groups, CR shape); this map embeds them for Helm-managed lifecycle.

# --- Grafana sidecar: dashboards (todo 33 provisions via ConfigMap label) ------
grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
        allowUiUpdates: true
    # --- Grafana sidecar: default Prometheus datasource (uid `prometheus`) ------
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus

# --- Prometheus: ServiceMonitor selection + alert rules ------------------------
prometheus:
  prometheusSpec:
    # Select ServiceMonitors carrying the Helm release label (release: kube-prometheus).
    # The model-server + model-server-canary ServiceMonitors (ns inferenceops) carry it.
    serviceMonitorSelectorNilUsesHelmValues: true

# --- InferenceOps alert rules (todo 32) ----------------------------------------
# Each key becomes a PrometheusRule CR: <fullname>-<key> in ns monitoring.
additionalPrometheusRulesMap:
  inferenceops-latency-alerts:
    groups:
      - name: inferenceops.latency
        rules:
          - alert: HighP95Latency
            expr: histogram_quantile(0.95, sum(rate(inferenceops_request_duration_seconds_bucket[5m])) by (le)) > 0.5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "P95 inference latency above 500 ms"
              description: "P95 request duration is {{ $value | humanizeDuration }} (threshold 500 ms) for the last 2 minutes."

  inferenceops-error-rate-alerts:
    groups:
      - name: inferenceops.error-rate
        rules:
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(inferenceops_error_count_total[5m]))
                /
                sum(rate(inferenceops_request_count_total[5m]))
              ) > 0.01
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Inference error rate above 1 %"
              description: "Error rate is {{ $value | humanizePercentage }} (threshold 1 %) for the last 2 minutes."

  inferenceops-gpu-alerts:
    groups:
      - name: inferenceops.gpu
        rules:
          - alert: HighGpuUtilization
            expr: DCGM_FI_DEV_GPU_UTIL > 90
            for: 5m
            labels:
              severity: info
            annotations:
              summary: "GPU utilisation above 90 %"
              description: "GPU {{ $labels.gpu }} utilisation is {{ $value }} % for the last 5 minutes."
          - alert: HighGpuMemoryUsage
            expr: |
              (
                DCGM_FI_DEV_FB_USED
                /
                (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)
              ) > 0.9
            for: 5m
            labels:
              severity: info
            annotations:
              summary: "GPU framebuffer memory usage above 90 %"
              description: "GPU {{ $labels.gpu }} memory usage is {{ $value | humanizePercentage }} for the last 5 minutes."
