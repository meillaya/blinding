[project]
name = "blinding"
version = "0.1.0"
description = "A local lab for serving, measuring, and tuning llama.cpp models."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.scripts]
blinding = "blinding.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blinding"]

[dependency-groups]
dev = [
    "basedpyright>=1.20",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-q"]
asyncio_mode = "auto"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src"]
exclude = ["**/__pycache__", ".venv", ".sandbox", "results"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
