[project]
name = "inferenceops"
version = "0.1.0"
description = "End-to-end MLOps platform for training, serving, and evaluating ML models."
requires-python = ">=3.12"
# Depend on the workspace members so a plain `uv sync` installs their runtime
# dependencies (uv syncs only the root project by default, not all members).
dependencies = [
    "inferenceops-gateway",
    "inferenceops-model-server",
    "inferenceops-worker",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "moto[s3,server]",
    "ruff",
    "basedpyright",
]

[tool.uv]
# Virtual workspace root: not itself an installable package.
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv.sources]
inferenceops-gateway = { workspace = true }
inferenceops-model-server = { workspace = true }
inferenceops-worker = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps", "tests"]
addopts = ["--strict-markers", "--cov"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["apps"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["apps", "tests"]
exclude = ["**/__pycache__", "**/.venv", ".git", ".omo"]
# Each app is a src-layout package (apps/<app>/src/<pkg>) that is run from
# source (package = false), so it is never installed into the venv. List the
# source roots here so absolute imports (import inferenceops_gateway, ...) and
# intra-package imports resolve statically.
extraPaths = ["apps/gateway/src", "apps/model-server/src", "apps/worker/src"]
venvPath = "."
venv = ".venv"
