# KServe-managed HPA — Standard mode (todo 44).
#
# With serving.kserve.io/autoscalerClass: hpa, KServe creates and OWNS a
# HorizontalPodAutoscaler for the predictor Deployment, driven by two
# predictor-level fields:
#
#   scaleMetric: cpu | memory    the HPA resource metric. (concurrency / rps
#                                are Serverless/KPA-only — the HPA class does
#                                not serve them; the platform's external-RPS
#                                scaling lives in k8s/base/hpa.yaml via
#                                prometheus-adapter, todo 20.)
#   scaleTarget: <int>           target average UTILIZATION percent for that
#                                metric (here: 75% of the cpu request).
#
# minReplicas / maxReplicas bound the HPA. Utilization is usage/request, so a
# cpu request is mandatory for a cpu metric (without one the HPA target reads
# <unknown>).
#
# Verify the KServe-managed HPA:
#
#   kubectl --context kind-inferenceops -n inferenceops get hpa
#   # NAME                       REFERENCE                          TARGETS    MINPODS   MAXPODS   REPLICAS
#   # sklearn-autoscaled-predictor Deployment/sklearn-autoscaled-predictor 1%/75%  1      5         1
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: sklearn-autoscaled
  namespace: inferenceops
  annotations:
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/autoscalerClass: hpa
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 5
    scaleMetric: cpu
    scaleTarget: 75
    model:
      modelFormat:
        name: sklearn
      storageUri: gs://kfserving-examples/models/sklearn/1.0/model
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
